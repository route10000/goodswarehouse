{% extends "panel/base.html" %}
{% load static %}
{% block title %}Выдача · GoodsWarehouse{% endblock %}
{% block head %}{{ block.super }}
  <link rel="stylesheet" href="{% static 'css/panel-order.css' %}">
  <script src="{% static 'js/panel-order.js' %}" defer></script>
{% endblock %}
{% block content %}
<div class="page-head">
  <h1 class="page-title">Выдача</h1>
</div>
<form class="pickup-search" role="search" method="get" action="{% url 'panel:pickup' %}"
  hx-get="{% url 'panel:pickup' %}" hx-target="#pickup-results" hx-replace-url="true">
  <label class="visually-hidden" for="pickup-q">Артикул, телефон или код клиента</label>
  <input class="pickup-search__input" id="pickup-q" type="search" name="q" value="{{ q }}" placeholder="Артикул, телефон или код клиента" autocomplete="off" enterkeyhint="search" autofocus
    hx-get="{% url 'panel:pickup' %}" hx-trigger="input changed delay:300ms, search" hx-target="#pickup-results" hx-replace-url="true">
  <button class="btn btn--quiet pickup-search__btn" type="submit">Найти</button>
</form>
<div id="pickup-results" class="pickup-results" aria-live="polite">
  {% include "panel/pickup/_results.html" %}
</div>
{% endblock %}
