{# Icon sidebar; becomes a bottom tab bar under 900px. Ордер на день and Выдача are placeholders until T7. #}
<nav class="sidebar" aria-label="Разделы панели">
  <ul class="sidebar__list">
    <li>
      <a class="sidebar__item" href="{% url 'panel:ops' %}" title="Ops-центр"{% if nav_active == "ops" %} aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span class="sidebar__label">Ops-центр</span>
      </a>
    </li>
    <li>
      <a class="sidebar__item" href="{% url 'panel:trucks' %}" title="Машины"{% if nav_active == "trucks" %} aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h11v10H2z"/><path d="M13 9h4l4 4v3h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        <span class="sidebar__label">Машины</span>
      </a>
    </li>
    <li>
      <a class="sidebar__item" href="{% url 'panel:cargo' %}" title="Грузы"{% if nav_active == "cargo" %} aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
        <span class="sidebar__label">Грузы</span>
      </a>
    </li>
    <li>
      <a class="sidebar__item" href="/panel/order/" title="Ордер на день"{% if nav_active == "order" %} aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z"/><path d="M15 5h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3"/><path d="M9 12h6M9 16h4"/></svg>

        {% if order_remaining %}<span class="sidebar__count">{{ order_remaining }}</span>{% endif %}
      </a>
    </li>
    <li>
      <a class="sidebar__item" href="/panel/pickup/" title="Выдача"{% if nav_active == "pickup" %} aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
        <span class="sidebar__label">Выдача</span>
      </a>
    </li>
    <li>
      <a class="sidebar__item" href="{% url 'panel:clients' %}" title="Клиенты"{% if nav_active == "clients" %} aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg>
